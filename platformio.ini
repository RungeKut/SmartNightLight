[platformio]
; Без этого "pio run" пытался бы собрать и env:native, для которого
; нужен хостовый компилятор. Тесты запускаются явно: pio test -e native
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps =
    NTPClient
    me-no-dev/ESPAsyncTCP
    me-no-dev/ESPAsyncWebServer
    bblanchon/ArduinoJson
board_build.f_cpu = 80000000L

; Разметка eagle.flash.4m2m.ld (4MB flash):
;   0x000000  прошивка   ~1MB
;   0x200000  LittleFS    2MB
;   0x3FB000  EEPROM      4KB
; EEPROM физически отдельно от прошивки и файловой системы, поэтому
; обычная перепрошивка настройки не трогает. Стирает только
; "pio run --target erase".
board_upload.flash_size = 4MB
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m2m.ld

; Не стирать весь чип при upload по USB — сохраняем EEPROM и LittleFS
board_upload.erase_cmd =

; Файловая система LittleFS для SPA фронтенда: pio run --target uploadfs
board_build.filesystem = littlefs

; Прошивка по USB. Для OTA по WiFi раскомментируйте и подставьте адрес,
; который устройство показывает на вкладке Dashboard:
; upload_protocol = espota
; upload_port = 192.168.88.xx

; Нативные тесты логики на хосте: pio test -e native
; NightLight.h не зависит от Arduino, поэтому собирается обычным
; компилятором без заглушек.
[env:native]
platform = native
test_framework = unity
; На Windows системного gcc нет, а MinGW уже лежит в пакетах
; PlatformIO — скрипт добавляет его в PATH сборки.
extra_scripts = pre:scripts/native_toolchain.py
build_flags =
    -I src
    -std=gnu++17
test_build_src = no
